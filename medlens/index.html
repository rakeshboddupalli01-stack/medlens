<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MedLens — AI-Powered Clinical Information Intelligence</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body data-theme="dark">

  <!-- Header Bar -->
  <header class="app-header">
    <div class="logo-container">
      <div class="logo-icon">M</div>
      <div class="logo-text">
        <h1>MedLens</h1>
        <p>AI Clinical Intelligence & Reference-Range Intelligence</p>
      </div>
    </div>

    <div class="header-actions">
      <div class="patient-select-wrapper">
        <label for="patient-select">ACTIVE PATIENT:</label>
        <select id="patient-select" class="patient-select">
          <!-- Dynamically populated -->
        </select>
      </div>

      <button id="btn-new-patient" class="btn btn-primary btn-sm">+ New Patient</button>
      <button id="btn-reset-data" class="btn btn-secondary btn-sm">↺ Reset Sample Data</button>
      <button id="btn-toggle-theme" class="btn btn-secondary btn-sm">☀️ Light Mode</button>
    </div>
  </header>

  <!-- App Main Layout -->
  <div class="app-container">
    <!-- Sidebar Navigation -->
    <aside class="app-sidebar">
      <a href="#" class="nav-item active" data-tab="dashboard">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/></svg>
        <span>Dashboard Overview</span>
      </a>
      <a href="#" class="nav-item" data-tab="intake">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
        <span>Patient Intake & Form</span>
      </a>
      <a href="#" class="nav-item" data-tab="ocr">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/></svg>
        <span>Medical Report OCR</span>
      </a>
      <a href="#" class="nav-item" data-tab="record">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/></svg>
        <span>Structured Record & Timeline</span>
      </a>
      <a href="#" class="nav-item" data-tab="verification">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        <span>Human Verification Drawer</span>
      </a>
      <a href="#" class="nav-item" data-tab="comparison">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M7 16V4m0 0L3 8m4-4l4 4m6 0v12m0 0l4-4m-4 4l-4-4"/></svg>
        <span>Report Delta Comparison</span>
      </a>
      <a href="#" class="nav-item" data-tab="summary">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
        <span>AI Summary & Guardrails</span>
      </a>
    </aside>

    <!-- Main View Container -->
    <main id="view-container" class="main-content">
      <!-- Views rendered dynamically by app.js -->
    </main>
  </div>

  <!-- Scripts -->
  <script src="js/sampleData.js"></script>
  <script src="js/intakeEngine.js"></script>
  <script src="js/reportParser.js"></script>
  <script src="js/mergeEngine.js"></script>
  <script src="js/comparisonEngine.js"></script>
  <script src="js/verificationEngine.js"></script>
  <script src="js/safetyScreener.js"></script>
  <script src="js/summaryEngine.js"></script>
  <script src="js/state.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
